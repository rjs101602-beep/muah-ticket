<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUAH TICKET</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

/* ══════════════════════════════
   GLOBAL
══════════════════════════════ */
:root {
  --bg:        #EDE7DC;
  --card:      #FDFAF5;
  --card2:     #F5F0E8;
  --border:    #DDD5C4;
  --border2:   #C5B99E;
  --brown:     #7A5C38;
  --brown-lt:  #A67C52;
  --brown-dim: rgba(122,92,56,0.10);
  --ink:       #241C0E;
  --ink2:      #5A4E3A;
  --muted:     #9A8E7A;
  --muted2:    #C8BFB0;
  --danger:    #B84C3A;
  --success:   #4A8A62;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
}

/* ══════════════════════════════
   USER PAGE
══════════════════════════════ */
#page-user {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 48px 16px 80px;
}
#page-user.hidden { display: none; }

.header { text-align: center; margin-bottom: 28px; }
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px; font-weight: 700;
  letter-spacing: 10px; color: var(--ink);
  line-height: 1; text-indent: 10px;
}
.logo-rule {
  display: flex; align-items: center; gap: 10px;
  margin: 8px auto 0; width: 260px;
}
.logo-rule::before, .logo-rule::after {
  content: ''; flex: 1; height: 1px; background: var(--border2);
}
.logo-diamond {
  width: 5px; height: 5px; background: var(--brown-lt);
  transform: rotate(45deg); flex-shrink: 0;
}
.logo-sub {
  font-family: 'Cormorant Garamond', serif;
  font-size: 10px; letter-spacing: 4px;
  color: var(--brown-lt); text-transform: uppercase;
  margin-top: 6px; text-indent: 4px;
}

/* TICKET CARD */
.ticket {
  background: var(--card); border: 1px solid var(--border);
  width: 100%; max-width: 420px; position: relative;
  box-shadow: 0 2px 0 var(--border2), 0 8px 32px rgba(60,40,10,.11);
}
.ticket::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--brown-lt) 30%, var(--brown) 50%, var(--brown-lt) 70%, transparent);
}
.cutout-l, .cutout-r {
  position: absolute; bottom: 70px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border2); z-index: 2;
}
.cutout-l { left: -10px; } .cutout-r { right: -10px; }
.ticket-body { padding: 32px 30px 24px; }
.ticket-stub {
  padding: 14px 30px 18px; background: var(--card2);
  border-top: 1.5px dashed var(--border2); text-align: center;
}
.stub-text { font-size: 11px; color: var(--muted); }
.stub-link {
  display: inline-block; margin-top: 6px;
  font-size: 12.5px; color: var(--brown); cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
  background: none; border: none;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 500; transition: color .2s;
}
.stub-link:hover { color: var(--ink); }

/* U TABS */
.u-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
.u-tab {
  flex: 1; padding: 10px 0; background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  color: var(--muted); font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s;
}
.u-tab.active { color: var(--brown); border-bottom-color: var(--brown); }
.u-panel { display: none; }
.u-panel.active { display: block; }

/* FIELDS */
.s-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 600; letter-spacing: .5px; margin-bottom: 3px;
}
.s-sub { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 18px; }
.field { margin-bottom: 12px; }
.field-label {
  display: block; font-size: 11px; font-weight: 500;
  color: var(--ink2); margin-bottom: 5px; letter-spacing: .7px; text-transform: uppercase;
}
input[type="text"], input[type="tel"], input[type="password"] {
  width: 100%; background: #fff; border: 1px solid var(--border);
  border-radius: 2px; padding: 13px 13px; color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif; font-size: 16px; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus { border-color: var(--brown-lt); box-shadow: 0 0 0 3px var(--brown-dim); }
input::placeholder { color: var(--muted2); }
input:disabled { background: var(--card2); color: var(--muted); cursor: not-allowed; }

/* PIN */
.pin-display {
  display: flex; gap: 8px; cursor: text; margin-bottom: 5px;
}
.pin-box {
  width: 44px; height: 52px; border: 1px solid var(--border);
  border-radius: 3px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: var(--ink);
  transition: border-color .15s, background .15s; user-select: none;
}
.pin-box.filled { border-color: var(--brown-lt); background: #FFF8EF; }
.pin-box.cur { border-color: var(--brown); box-shadow: 0 0 0 2px var(--brown-dim); }
.pin-real { position: absolute; opacity: 0; pointer-events: none; height: 0; width: 0; }
.pin-hint { font-size: 11px; color: var(--muted); }
.pin-hint.ok { color: var(--success); }
.pin-hint.err { color: var(--danger); }

/* STEP */
.step-row { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
.step-seg { flex: 1; height: 2px; border-radius: 1px; background: var(--border); transition: background .3s; }
.step-seg.on { background: var(--brown); }
.step-lbl { font-size: 10px; color: var(--muted); white-space: nowrap; }

.btn-main {
  width: 100%; padding: 15px; background: var(--brown); border: none; border-radius: 2px;
  color: #FDFAF5; font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer;
  margin-top: 8px; letter-spacing: 1px; transition: all .2s;
  min-height: 48px;
}
.btn-main:hover { background: var(--ink); }
.btn-main:active { transform: scale(.99); }
.btn-main:disabled { opacity: .4; cursor: not-allowed; background: var(--brown); }

.success-view { display: none; text-align: center; padding: 6px 0; }
.success-mark {
  width: 56px; height: 56px; border: 1.5px solid var(--brown-lt); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px; font-size: 20px; color: var(--brown);
  animation: pop .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.success-view h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 21px; letter-spacing: 2px; margin-bottom: 7px;
}
.success-view p { color: var(--muted); font-size: 12.5px; line-height: 1.8; }

/* ══════════════════════════════
   MODALS
══════════════════════════════ */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(36,28,14,.5); z-index: 300;
  align-items: flex-start; justify-content: center; padding: 20px;
  backdrop-filter: blur(2px);
  overflow-y: auto;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; width: 100%; max-width: 360px;
  padding: 26px 22px 20px; position: relative;
  box-shadow: 0 12px 40px rgba(36,28,14,.2);
  animation: slideUp .22s ease;
  margin: 40px 0;
}
@keyframes slideUp { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent, var(--brown-lt) 40%, var(--brown) 50%, var(--brown-lt) 60%, transparent);
}
.modal-title {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 17px; font-weight: 700; color: var(--ink);
  margin-bottom: 12px; letter-spacing: .2px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.modal-sub { font-size: 12px; color: var(--muted); line-height: 1.7; margin-bottom: 18px; }
.modal-close {
  position: absolute; top: 12px; right: 14px;
  background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer;
}
.modal-sent { display: none; text-align: center; padding: 4px 0; }
.modal-sent-icon { font-size: 28px; margin-bottom: 8px; }
.modal-sent p { font-size: 12.5px; color: var(--muted); line-height: 1.8; }

/* CONFIRM */
.confirm-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 600;
  align-items: center; justify-content: center; padding: 20px;
}
.confirm-overlay.open { display: flex; }
.confirm-box {
  background: #1A1610; border: 1px solid #3A3228;
  border-radius: 4px; padding: 28px 24px 22px;
  width: 100%; max-width: 300px; text-align: center;
  animation: slideUp .2s ease;
}
.confirm-box h3 { font-size: 16px; color: #F0EBE2; margin-bottom: 8px; }
.confirm-box p { font-size: 12.5px; color: #706A5E; line-height: 1.7; margin-bottom: 20px; }
.confirm-btns { display: flex; gap: 10px; }
.c-cancel {
  flex: 1; padding: 10px; background: none;
  border: 1px solid #2E2E3A; border-radius: 3px; color: #706A5E;
  font-family: 'Noto Sans KR', sans-serif; font-size: 13px; cursor: pointer; transition: all .2s;
}
.c-cancel:hover { border-color: #C9A96E; color: #C9A96E; }
.c-ok {
  flex: 1; padding: 10px; background: #C0614A; border: none; border-radius: 3px;
  color: #fff; font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: filter .2s;
}
.c-ok:hover { filter: brightness(1.1); }

/* TOAST */
#toast {
  position: fixed; bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #241C0E; border-radius: 2px;
  padding: 10px 20px; font-size: 13px; color: #FDFAF5;
  opacity: 0; pointer-events: none; white-space: nowrap;
  transition: all .25s; z-index: 9999;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:480px){
  .ticket-body{padding:22px 16px 18px;}
  .ticket-stub{padding:12px 16px 16px;}
  .modal{padding:22px 18px 18px;}
  .booking-slide{padding:20px 16px;}
  .show-date-btn{padding:15px 16px;}
}
@media(max-width:360px){
  .logo{font-size:32px; letter-spacing:8px;}
  .ticket-body{padding:18px 14px 16px;}
  .booking-slide{padding:16px 14px;}
  .s-title{font-size:19px !important;}
  .modal{padding:20px 14px 16px;}
}
/* ══ 페이지 전환 ══ */
#page-home {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 48px 16px 80px;
}
#page-home.hidden { display: none; }

/* ══════════════════════════════
   BOOKING PAGE
══════════════════════════════ */
#page-booking {
  display: none; min-height: 100vh;
  background: var(--bg); padding: 0 0 80px;
}
#page-booking.active { display: block; }

.booking-topbar {
  background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px; height: 52px; position: sticky; top: 0; z-index: 50;
  box-shadow: 0 1px 6px rgba(60,40,10,.07);
}
.booking-back {
  background: none; border: none; font-size: 20px; cursor: pointer;
  color: var(--brown); padding: 4px; line-height: 1; transition: opacity .2s;
}
.booking-back:hover { opacity: .7; }
.booking-topbar-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 700; letter-spacing: 2px; color: var(--ink);
}

/* 탭 슬라이더 */
.booking-tabs {
  display: flex; background: var(--card2);
  border-bottom: 1px solid var(--border); padding: 0 20px;
}
.booking-tab {
  flex: 1; padding: 13px 4px; background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  font-family: 'Noto Sans KR', sans-serif; font-size: 12.5px; font-weight: 500;
  color: var(--muted); cursor: pointer; transition: all .2s; text-align: center;
}
.booking-tab.active { color: var(--brown); border-bottom-color: var(--brown); }

/* 슬라이드 컨테이너 */
.booking-slides { overflow: hidden; position: relative; }
.booking-slide-track {
  display: flex; transition: transform .35s cubic-bezier(.4,0,.2,1);
}
.booking-slide {
  min-width: 100%; padding: 24px 20px;
}

/* 공연 안내사항 / 공연 정보 */
.info-section { margin-bottom: 20px; }
.info-section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 600; color: var(--ink);
  margin-bottom: 12px; letter-spacing: .5px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.info-text {
  font-size: 13.5px; color: var(--ink2); line-height: 1.9;
  white-space: pre-wrap; word-break: keep-all;
}
.info-empty {
  font-size: 13px; color: var(--muted); text-align: center;
  padding: 40px 0; font-style: italic;
}

/* 포스터 이미지 */
.poster-wrap {
  width: 100%; max-width: 320px; margin: 0 auto 20px;
  border-radius: 4px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(60,40,10,.15);
}
.poster-wrap img {
  width: 100%; display: block;
  aspect-ratio: 2/3; object-fit: cover;
}
.poster-placeholder {
  width: 100%; aspect-ratio: 2/3;
  background: var(--card2); border: 2px dashed var(--border2);
  border-radius: 4px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--muted); font-size: 13px;
}
.poster-placeholder .ph-icon { font-size: 36px; opacity: .4; }

/* 공연 예매 — 날짜 선택 */
.show-select-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-weight: 600; color: var(--ink);
  margin-bottom: 12px; letter-spacing: .5px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.show-select-sub {
  font-size: 12.5px; color: var(--muted);
  margin-bottom: 24px; line-height: 1.6;
}
.show-date-grid { display: flex; flex-direction: column; gap: 12px; }
.show-date-btn {
  background: var(--card); border: 1.5px solid var(--border);
  border-radius: 4px; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; transition: all .2s; text-align: left; width: 100%;
  font-family: 'Noto Sans KR', sans-serif;
  box-shadow: 0 1px 4px rgba(60,40,10,.06);
}
.show-date-btn:hover {
  border-color: var(--brown-lt); background: #FFF5E6;
  box-shadow: 0 3px 12px rgba(122,92,56,.12); transform: translateY(-1px);
}
.show-date-btn:active { transform: scale(.99); }
.show-date-btn.selected { border-color: var(--brown); background: var(--brown-dim); }
.sdb-day { font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .3px; }
.sdb-time { font-size: 17px; font-weight: 700; color: var(--brown); font-family: 'Noto Sans KR', sans-serif; letter-spacing: .3px; }
.sdb-tag {
  font-size: 11px; padding: 4px 10px;
  background: var(--brown-dim); color: var(--brown);
  border-radius: 20px; font-weight: 500; flex-shrink: 0;
}

/* 변경·취소 안내 */
.change-notice {
  margin-top: 22px; padding: 16px 18px;
  background: var(--card2); border: 1px solid var(--border);
  border-left: 3px solid var(--brown-lt); border-radius: 3px;
  font-size: 12.5px; color: var(--ink2); line-height: 1.7;
  text-align: center;
}
.change-notice strong { color: var(--brown); }
.change-notice-sub { font-size: 11px; color: var(--muted); margin-top: 3px; margin-bottom: 12px; }
.change-notice-row {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 12px; color: var(--ink2); margin-bottom: 6px;
}
.change-notice-row span {
  font-size: 10.5px; font-weight: 700; color: var(--brown);
  background: var(--brown-dim); padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
}
.change-notice-phone { margin-top: 12px; font-size: 13px; color: var(--ink); }

/* 필수/선택 마크 */
.req-mark { font-size: 10px; color: var(--danger); font-weight: 600; text-transform: none; letter-spacing: 0; }
.opt-mark { font-size: 10px; color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

</style>
</head>

<script>
// ══ 공연 일정 ══
const SHOW_LABELS = {
  '2025-08-15-14': { day: '8월 15일 토요일', time: '오후 2:00' },
  '2025-08-15-18': { day: '8월 15일 토요일', time: '오후 6:00' },
  '2025-08-16-13': { day: '8월 16일 일요일', time: '오후 1:00' },
  '2025-08-16-16': { day: '8월 16일 일요일', time: '오후 4:00' },
};

const DEFAULT_NOTICE = `뮤아지경 제 4회 정기 공연 예매 안내사항

• 본 공연은 15세 이상 관람가입니다.
• 본 공연은 뮤아지경 제 4회 정기 공연입니다. 예상 소요시간은 100분 입니다.
• 본 공연은 무료로 관람하실 수 있습니다.
• 본 공연의 티켓은 공연 시간 1시간 전부터 현장 수령이 가능하며, 수령 순으로 좌석이 배정됩니다.
• 주차 공간이 협소하오니 대중교통 이용을 부탁드립니다.
• 공연 입장은 고지된 공연 시간 30분 전부터 가능합니다.
• 공연 중 사진과 영상 촬영이 불가합니다.
• 꽃다발 및 음식물 선물은 공연장 규정상 정중히 사양하겠습니다.
• 공연장 내 음료와 음식물 섭취 및 반입이 엄격하게 금지되어 있습니다.
• 인터미션 없이 공연이 진행되며 공연 도중에는 입장이 제한될 수 있으니 유의하시길 바랍니다.`;

let selectedShowKey = null;
let bookingTabIdx = 0;

// ══ 공연 콘텐츠 저장소 (localStorage) ══
const LS_CONTENT = 'muah_content';
function getContent(){
  try{
    const c = JSON.parse(localStorage.getItem(LS_CONTENT)||'{}');
    if(!c.notice) c.notice = DEFAULT_NOTICE;
    return c;
  }catch{ return { notice: DEFAULT_NOTICE }; }
}
function setContent(d){ localStorage.setItem(LS_CONTENT, JSON.stringify(d)); }

// ══ 페이지 전환 ══
function goBooking(){
  document.getElementById('page-home').classList.add('hidden');
  document.getElementById('page-booking').classList.add('active');
  renderBookingContent();
  switchBookingTab(0);
}
function goBack(){
  document.getElementById('page-booking').classList.remove('active');
  document.getElementById('page-home').classList.remove('hidden');
  selectedShowKey = null;
  clearBookingForm();
}
function clearBookingForm(){
  ['bf-name','bf-phone','bf-count','bf-message'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
}

// ══ 탭 전환 ══
function switchBookingTab(idx){
  bookingTabIdx = idx;
  document.querySelectorAll('.booking-tab').forEach((b,i)=>b.classList.toggle('active', i===idx));
  document.getElementById('bookingTrack').style.transform = `translateX(-${idx*100}%)`;
}

// ══ 공연 안내사항 / 공연 정보 / 포스터 렌더 ══
function renderBookingContent(){
  const c = getContent();

  const noticeEl = document.getElementById('noticeContent');
  if(noticeEl) noticeEl.textContent = c.notice || '';

  const posterWrap = document.getElementById('posterWrap');
  if(posterWrap){
    if(c.poster) posterWrap.innerHTML = `<div class="poster-wrap"><img src="${c.poster}" alt="공연 포스터"></div>`;
    else posterWrap.innerHTML = `<div class="poster-placeholder"><span class="ph-icon">🎭</span><span>포스터 준비 중</span></div>`;
  }

  const infoEl = document.getElementById('showInfoContent');
  if(infoEl){
    infoEl.textContent = c.showinfo || '';
  }
}

// ══ 날짜 선택 ══
function selectShow(key){
  selectedShowKey = key;
  document.querySelectorAll('.show-date-btn').forEach(btn=>{
    btn.classList.toggle('selected', btn.getAttribute('onclick').includes(key));
  });
}

// ══ 전화번호 포맷 ══
function fmtPhone(el){
  let v = el.value.replace(/\D/g,'');
  if(v.length>3 && v.length<=7) v = v.slice(0,3)+'-'+v.slice(3);
  else if(v.length>7) v = v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7,11);
  el.value = v;
}

// ══ 날짜 선택 후 다음 단계 — 예매자 정보 입력 모달 ══
function goBookingStep2(){
  if(!selectedShowKey){ toast('공연 날짜를 선택해주세요.'); return; }
  const s = SHOW_LABELS[selectedShowKey];
  document.getElementById('bfSelectedShow').innerHTML = `선택한 공연: <strong>${s.day} ${s.time}</strong>`;
  document.getElementById('bookingFormModal').classList.add('open');
}
function closeBookingFormModal(){
  document.getElementById('bookingFormModal').classList.remove('open');
}

// ══ 예매 확인 모달 ══
function openBookingConfirm(){
  const name = document.getElementById('bf-name').value.trim();
  const phone = document.getElementById('bf-phone').value.replace(/\D/g,'');
  const count = document.getElementById('bf-count').value.trim();

  if(!name){ toast('성함을 입력해주세요.'); return; }
  if(phone.length<10){ toast('올바른 연락처를 입력해주세요.'); return; }
  if(!count || isNaN(count) || Number(count)<1){ toast('총 인원 수를 숫자로 입력해주세요.'); return; }

  const s = SHOW_LABELS[selectedShowKey];
  document.getElementById('bcSummary').innerHTML =
    `<strong>${name}</strong>님 (총 ${count}명)<br>${s.day} ${s.time}<br>위 내용으로 예매하시겠어요?`;
  closeBookingFormModal();
  document.getElementById('confirmBookingModal').classList.add('open');
}
function closeBookingModal(){
  document.getElementById('confirmBookingModal').classList.remove('open');
}

// ══ 예매 제출 — Google Forms 연동 ══
const FORM_ACTION = "https://docs.google.com/forms/d/e/1FAIpQLSftJfYFWMYMP45-iPnFIlyBabD0FFxdUYGoohmc_TNWEPT6Qg/formResponse";
const FORM_FIELDS = {
  name:      "entry.122261348",
  phone:     "entry.526378259",
  bookedAt:  "entry.1958870224",
  showLabel: "entry.602864043",
  count:     "entry.641299743",
  message:   "entry.2011489665"
};

function submitBooking(){
  const name = document.getElementById('bf-name').value.trim();
  const phone = document.getElementById('bf-phone').value.replace(/\D/g,'');
  const count = document.getElementById('bf-count').value.trim();
  const message = document.getElementById('bf-message').value.trim();
  const s = SHOW_LABELS[selectedShowKey];

  const bookingData = {
    name, phone, count, message,
    bookedAt: new Date().toLocaleString('ko-KR'),
    showLabel: `${s.day} ${s.time}`
  };

  toast('예매 처리 중...');
  console.log('[submitBooking] FORM_ACTION:', FORM_ACTION);
  console.log('[submitBooking] bookingData:', bookingData);

  // ── fetch + no-cors POST 방식 (Google Forms 표준 제출 방법) ──
  const formData = new FormData();
  Object.entries(FORM_FIELDS).forEach(([key, entryId])=>{
    formData.append(entryId, bookingData[key]);
    console.log(`[submitBooking] ${entryId} = ${bookingData[key]}`);
  });

  fetch(FORM_ACTION, {
    method: 'POST',
    mode: 'no-cors',
    body: formData
  }).then(()=>{
    console.log('[submitBooking] fetch 완료');
  }).catch(err=>{
    console.error('[submitBooking] fetch 에러:', err);
  });

  setTimeout(()=>{
    closeBookingModal();
    document.getElementById('doneSummary').innerHTML =
      `<strong>${name}</strong>님,<br>${s.day} ${s.time}<br>예매가 완료됐어요.`;
    document.getElementById('doneModal').classList.add('open');
  }, 1000);
}
function closeDoneModal(){
  document.getElementById('doneModal').classList.remove('open');
  goBack();
}

// ══ TOAST ══
let tTm;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(tTm);
  tTm = setTimeout(()=>el.classList.remove('show'), 3000);
}

// ══ DOM 로드 후 이벤트 리스너 등록 ══
window.addEventListener('DOMContentLoaded', function(){
  const bfModal = document.getElementById('bookingFormModal');
  if(bfModal) bfModal.addEventListener('click', function(e){ if(e.target===this) closeBookingFormModal(); });

  const cbModal = document.getElementById('confirmBookingModal');
  if(cbModal) cbModal.addEventListener('click', function(e){ if(e.target===this) closeBookingModal(); });

  const dModal = document.getElementById('doneModal');
  if(dModal) dModal.addEventListener('click', function(e){ if(e.target===this) closeDoneModal(); });
});

</script>
</body>
